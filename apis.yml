aid: qsic
name: Qsic
description: >-
  Qsic (styled QSIC) is an Australian-founded, AI-driven in-store audio and retail media platform,
  headquartered in Melbourne with a North American office in Dallas, Texas. The platform blends
  curated music, targeted audio advertising and store-level intelligence, deploying either over a
  retailer's existing speaker infrastructure or over premium smart speakers, and adapting playback
  to ambient conditions, dayparts and shopper behaviour. Qsic sells three connected products —
  In-Store Audio, Ads and Intelligence — and positions the combination as a way to turn physical
  stores into measurable retail media networks with store-level performance reporting and
  demand-side platform integration. Publicly reported deployments include 7-Eleven ("Gulp Radio"),
  Dollar General, Coles Liquor and Mecca. Qsic runs a live JSON API host at api.getqsic.com and a
  Vanta-hosted trust center, but publishes no public developer portal, API reference or
  machine-readable specification as of this profile.
